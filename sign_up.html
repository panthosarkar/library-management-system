<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking signup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container-fluid min-vh-100">
  <div class="row min-vh-100">

    <!-- LEFT IMAGE -->
    <div class="col-lg-6 d-none d-lg-flex flex-column justify-content-between p-0 position-relative">

      <!-- Image -->
      <img src="s.png" alt="Login Image" style="width: 100vh; height: 100vh;">

      <!-- Overlay Content -->
      <div class="position-absolute top-0 start-0 w-100 h-100
                  d-flex flex-column justify-content-between text-white p-5">

        <div class="fw-semibold fs-5">Booking.com</div>

        <div>
          <h5 class="fw-semibold mb-3">
            Eco-friendly hotels are becoming increasingly popular appealing.
          </h5>

          <div class="d-flex gap-2">
            <span class="badge rounded-pill bg-primary px-3">&nbsp;</span>
            <span class="badge rounded-pill bg-light opacity-50 px-2">&nbsp;</span>
            <span class="badge rounded-pill bg-light opacity-50 px-2">&nbsp;</span>
          </div>
        </div>

      </div>
    </div>

    <!-- RIGHT FORM -->
    <div class="col-lg-6 d-flex align-items-center justify-content-center">
      <div class="card shadow rounded-4 w-100 mx-3" style="max-width:420px">

        <div class="card-body p-4 p-lg-5">

          <div class="text-center mb-4">
            <h4 class="fw-bold mb-1">Sing Up For Free</h4>
            <h5 class="fw-bold text-primary mb-3">Booking.com</h5>
            <p class="text-muted small">
              Eco-friendly hotels are becoming increasingly popular appealing to travelers.
            </p>
          </div>

          <form>

             <div class="mb-3">
              <input type="Name" class="form-control py-2" placeholder="Name">
            </div>

            <div class="mb-3">
              <input type="email" class="form-control py-2" placeholder="Email">
            </div>

            <div class="mb-2">
              <input type="password" class="form-control py-2" placeholder="Password">
            </div>

            <div class="text-end mb-3">
              <a href="#" class="small text-muted text-decoration-none">
                Forgot your password
              </a>
            </div>

            <button class="btn btn-primary w-100 py-2 fw-semibold mb-3">
              Sign In
            </button>

            <div class="text-center text-muted small mb-3">Or</div>

            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-primary py-2 fw-semibold">
                Sign In With Google
              </button>

              <button type="button" class="btn btn-warning text-white py-2 fw-semibold">
                Sign In With Facebook
              </button>
            </div>

            <p class="text-center small mt-4 mb-0">
              Already have an account ?
             <a href="sign_in.html" class="text-primary fw-semibold text-decoration-none">
                Sign in
              </a>
            </p>

          </form>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
